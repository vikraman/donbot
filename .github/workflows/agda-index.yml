name: agda index

# builds the search index of each agda library
# every 6 days to keep cache alive, and on indexer changes
on:
  schedule:
    - cron: '17 4 */6 * *'
  push:
    branches: [main]
    paths:
      - agda-index/AgdaIndex.hs
      - .github/workflows/agda-index.yml
  workflow_dispatch:
    inputs:
      force:
        description: publish even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  GHC_VERSION: 9.12.2
  CABAL_VERSION: 3.16.0.0
  AGDA_VERSION: 2.9.0
  TAG: agda-index
  ISSUE: agda index build failing
  # name repo, one per line
  LIBRARIES: |
    stdlib agda/agda-stdlib
    cubical agda/cubical
    TypeTopology martinescardo/TypeTopology
    categories agda/agda-categories
    unimath UniMath/agda-unimath
    En DesyncTheThird/HoTT

jobs:
  # libraries whose commit, agda or indexer changed since the last release
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shas: ${{ steps.plan.outputs.shas }}
      indexer: ${{ steps.plan.outputs.indexer }}
      stamps: ${{ steps.plan.outputs.stamps }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          indexer="${{ hashFiles('agda-index/AgdaIndex.hs', '.github/workflows/agda-index.yml') }}"
          notes=$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)
          build=""
          stamps=""
          shas="{}"
          while read -r name repo; do
            [ -n "$name" ] || continue
            sha=$(git ls-remote "https://github.com/$repo" HEAD | cut -f1)
            shas=$(jq -c --arg k "$name" --arg v "$sha" '. + {($k): $v}' <<< "$shas")
            stamp="$name $sha agda $AGDA_VERSION ghc $GHC_VERSION indexer $indexer"
            stamps="$stamps$stamp;"
            # stamps hide in comments in the release notes
            if [ "$FORCE" = "true" ] || ! printf '%s\n' "$notes" | grep -qxF "<!-- stamp: $stamp -->"; then
              build="$build $name"
            fi
          done <<< "$LIBRARIES"
          {
            echo "build=${build# }"
            echo "matrix=$(jq -cn --arg b "${build# }" '$b | split(" ") | map(select(. != ""))')"
            echo "shas=$shas"
            echo "indexer=$indexer"
            echo "stamps=$stamps"
          } >> "$GITHUB_OUTPUT"

  # indexer binary, built only when its cache misses
  indexer:
    needs: plan
    if: needs.plan.outputs.build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      bin: ${{ steps.keys.outputs.bin }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache keys
        id: keys
        run: |
          echo "cabal=cabal-$GHC_VERSION-$AGDA_VERSION-${{ hashFiles('agda-index/AgdaIndex.hs') }}" >> "$GITHUB_OUTPUT"
          echo "bin=agda-index-bin-$GHC_VERSION-$AGDA_VERSION-${{ hashFiles('agda-index/AgdaIndex.hs') }}" >> "$GITHUB_OUTPUT"

      - name: Restore indexer
        id: bin
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: ~/agda-index-bin
          key: ${{ steps.keys.outputs.bin }}

      # one dir for packages, store and script builds
      - name: Pin cabal dir
        if: steps.bin.outputs.cache-hit != 'true'
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"

      # before setup, so cabal update refreshes it
      - name: Restore cabal cache
        id: cabal
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/script-builds
          key: ${{ steps.keys.outputs.cabal }}
          restore-keys: cabal-${{ env.GHC_VERSION }}-${{ env.AGDA_VERSION }}-

      - uses: haskell-actions/setup@v2
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: true

      - name: Build indexer
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          cabal build --ghc-options='+RTS -M6G -RTS' agda-index/AgdaIndex.hs
          mkdir -p ~/agda-index-bin
          cp "$(cabal list-bin agda-index/AgdaIndex.hs)" ~/agda-index-bin/agda-index

      - name: Save cabal cache
        if: steps.bin.outputs.cache-hit != 'true' && steps.cabal.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/script-builds
          key: ${{ steps.keys.outputs.cabal }}

      - name: Save indexer
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/agda-index-bin
          key: ${{ steps.keys.outputs.bin }}

  # one job per library
  index:
    needs: [plan, indexer]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LIB: ${{ matrix.lib }}
      SHAS: ${{ needs.plan.outputs.shas }}
      BUILD: ${{ needs.plan.outputs.indexer }}
    steps:
      # self-contained, agda embeds its data files
      - name: Restore indexer
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: ~/agda-index-bin
          key: ${{ needs.indexer.outputs.bin }}

      # categories checks against stdlib, En against cubical
      - name: Checkout library
        run: |
          case $LIB in categories) deps=stdlib ;; En) deps=cubical ;; *) deps="" ;; esac
          while read -r name repo; do
            [ -n "$name" ] || continue
            if [ "$name" = "$LIB" ] || [[ " $deps " == *" $name "* ]]; then
              git clone --quiet --filter=blob:none "https://github.com/$repo" "$name"
              git -C "$name" checkout --quiet "$(jq -r --arg k "$name" '.[$k]' <<< "$SHAS")"
            fi
          done <<< "$LIBRARIES"
          echo "SHA=$(jq -r --arg k "$LIB" '.[$k]' <<< "$SHAS")" >> "$GITHUB_ENV"

      # same paths in every job
      - name: Restore interface cache
        uses: actions/cache/restore@v6
        with:
          path: |
            stdlib/_build
            stdlib/doc/_build
            cubical/_build
            TypeTopology/_build
            categories/_build
            unimath/_build
            En/_build
          key: agdai-${{ env.AGDA_VERSION }}-${{ matrix.lib }}-${{ github.run_id }}
          restore-keys: |
            agdai-${{ env.AGDA_VERSION }}-${{ matrix.lib }}-
            agdai-${{ env.AGDA_VERSION }}-

      - name: Index
        run: |
          idx() { ~/agda-index-bin/agda-index +RTS -M14G -RTS --index --index-lib="$LIB" --index-build="$BUILD" --index-commit="$SHA" "$@"; }
          out="$GITHUB_WORKSPACE/$LIB.ndjson"
          case $LIB in
            stdlib)
              cd stdlib
              # non-deprecated modules, as GenerateEverything picks them
              {
                echo '{-# OPTIONS --rewriting --guardedness --sized-types #-}'
                echo 'module Everything where'
                find src -name '*.agda' -o -name '*.lagda' | LC_ALL=C sort | while read -r f; do
                  head -12 "$f" | grep -qi 'deprecated' && continue
                  m=${f#src/}; m=${m%.agda}; m=${m%.lagda}
                  echo "import ${m//\//.}"
                done
              } > doc/Everything.agda
              cd doc
              idx --index-url=https://agda.github.io/agda-stdlib/master/ \
                --index-source="https://github.com/agda/agda-stdlib/blob/$SHA/src/" \
                --index-out="$out" Everything.agda
              ;;
            cubical)
              cd cubical
              ./generate-everything.sh > Cubical/Everything.agda
              idx --index-url=https://agda.github.io/cubical/ \
                --index-source="https://github.com/agda/cubical/blob/$SHA/" \
                --index-out="$out" Cubical/Everything.agda
              ;;
            TypeTopology)
              cd TypeTopology/source
              idx --index-url=https://martinescardo.github.io/TypeTopology/ \
                --index-source="https://github.com/martinescardo/TypeTopology/blob/$SHA/source/" \
                --index-out="$out" AllModulesIndex.lagda
              ;;
            # against stdlib master, by include paths since it pins a release
            categories)
              cd categories
              make Everything.agda
              idx --no-libraries -i . -i src -i ../stdlib/src --index-modules=Categories \
                --index-url=https://agda.github.io/agda-categories/ \
                --index-source="https://github.com/agda/agda-categories/blob/$SHA/src/" \
                --index-out="$out" Everything.agda
              ;;
            unimath)
              cd unimath
              make SKIPAGDA=1 src/everything.lagda.md
              idx --index-url=https://unimath.github.io/agda-unimath/ \
                --index-source="https://github.com/UniMath/agda-unimath/blob/$SHA/src/" \
                --index-out="$out" src/everything.lagda.md
              ;;
            # against cubical master, by a library file
            En)
              cd En
              printf '%s\n' "$GITHUB_WORKSPACE/cubical/cubical.agda-lib" "$PWD/agda-En.agda-lib" > ../En-libraries
              .github/scripts/gen-everything.sh > En/Everything.agda
              idx --library-file=../En-libraries --index-modules=En \
                --index-url=https://cokernelpanic.com/HoTT/agda/ \
                --index-source="https://github.com/DesyncTheThird/HoTT/blob/$SHA/" \
                --index-out="$out" En/Everything.agda
              ;;
            *) echo "no recipe for $LIB"; exit 1 ;;
          esac
          test -s "$out"
          gzip -9 "$out"

      - name: Save interface cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            stdlib/_build
            stdlib/doc/_build
            cubical/_build
            TypeTopology/_build
            categories/_build
            unimath/_build
            En/_build
          key: agdai-${{ env.AGDA_VERSION }}-${{ matrix.lib }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v7
        with:
          name: agda-index-${{ matrix.lib }}
          path: ${{ matrix.lib }}.ndjson.gz
          retention-days: 7

  publish:
    needs: [plan, index]
    if: always() && needs.plan.outputs.build != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      failed: ${{ steps.collect.outputs.failed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agda-index-*
          merge-multiple: true

      # the libraries that didn't index
      - name: Collect
        id: collect
        run: |
          failed=""
          for name in ${{ needs.plan.outputs.build }}; do
            [ -s "$name.ndjson.gz" ] || failed="$failed $name"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          ls ./*.ndjson.gz >/dev/null 2>&1 || { echo "no library indexed"; exit 1; }

      - name: Publish
        env:
          STAMPS: ${{ needs.plan.outputs.stamps }}
          FAILED: ${{ steps.collect.outputs.failed }}
        run: |
          old=$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "agda index" --notes "" --latest=false
          for f in *.ndjson.gz; do gh release upload "$TAG" "$f" --clobber; done
          # rows and stamps of fresh libraries, the old ones for the rest
          rows=""
          stamps=""
          IFS=';' read -ra all <<< "$STAMPS"
          for stamp in "${all[@]}"; do
            [ -n "$stamp" ] || continue
            name=${stamp%% *}
            sha=$(echo "$stamp" | cut -d' ' -f2)
            if [ -f "$name.ndjson.gz" ]; then
              count=$(gunzip -c "$name.ndjson.gz" | head -1 | jq '.meta.count')
              rows="$rows| $name | [\`${sha:0:7}\`]($(gunzip -c "$name.ndjson.gz" | head -1 | jq -r '.meta.source' | sed 's|/blob/.*||')/commit/$sha) | $count |"$'\n'
              stamps="$stamps<!-- stamp: $stamp -->"$'\n'
            else
              rows="$rows$(printf '%s\n' "$old" | grep "^| $name |" || true)"$'\n'
              stamps="$stamps$(printf '%s\n' "$old" | grep "^<!-- stamp: $name " || true)"$'\n'
            fi
          done
          {
            echo "Search index of Agda libraries for donbot's \`agda\` command, one \`<library>.ndjson.gz\` each."
            echo
            echo "| library | commit | definitions |"
            echo "|---|---|---:|"
            printf '%s' "$rows" | grep -v '^$'
            echo
            echo "Agda $AGDA_VERSION · GHC $GHC_VERSION · built $(date -u +%F) by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)${FAILED:+ · failed: $FAILED}"
            echo
            printf '%s' "$stamps" | grep -v '^$'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Close failure issue
        if: needs.index.result == 'success'
        run: |
          gh issue list --state open --search "in:title \"$ISSUE\"" --json number -q '.[].number' |
            xargs -r -n1 gh issue close --comment "Fixed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # corpus
  corpus:
    needs: publish
    uses: ./.github/workflows/agda-corpus.yml

  # notify on index build failure
  notify:
    needs: [plan, index, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update failure issue
        env:
          FAILED: ${{ needs.publish.outputs.failed }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          what=${FAILED:+ ($FAILED)}
          open=$(gh issue list --state open --search "in:title \"$ISSUE\"" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again$what: $run"
          else
            gh issue create --title "$ISSUE" --body "The agda index build failed$what: $run. donbot keeps serving the last published index of each library until its build succeeds."
          fi

  # keepalive after 60 idle days
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow enable agda-index.yml
