name: agda index

# builds the cubical and stdlib search index
# every 6 days to keep cache alive
on:
  schedule:
    - cron: '17 4 */6 * *'
  workflow_dispatch:
    inputs:
      force:
        description: publish even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  GHC_VERSION: 9.12.2
  CABAL_VERSION: 3.16.0.0
  AGDA_VERSION: 2.9.0
  TAG: agda-index
  ISSUE: agda index build failing

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      skip: ${{ steps.commits.outputs.skip }}
      stamp: ${{ steps.commits.outputs.stamp }}
      cubical: ${{ steps.commits.outputs.cubical }}
      stdlib: ${{ steps.commits.outputs.stdlib }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: agda/cubical
          path: cubical
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: agda/agda-stdlib
          path: stdlib
          persist-credentials: false

      # skip if nothing changed
      - name: Check for changes
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cubical=$(git -C cubical rev-parse HEAD)
          stdlib=$(git -C stdlib rev-parse HEAD)
          stamp="cubical $cubical stdlib $stdlib agda $AGDA_VERSION ghc $GHC_VERSION indexer ${{ hashFiles('agda-index/AgdaIndex.hs', '.github/workflows/agda-index.yml') }}"
          {
            echo "cubical=$cubical"
            echo "stdlib=$stdlib"
            echo "stamp=$stamp"
          } >> "$GITHUB_OUTPUT"
          # stamp hides in a comment in the release notes
          last=$(gh release view "$TAG" --json body -q .body 2>/dev/null | sed -n 's/^<!-- stamp: \(.*\) -->$/\1/p' || true)
          if [ "$last" = "$stamp" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # stdlib's cabal files
      - name: Cache keys
        id: keys
        run: |
          echo "cabal=cabal-$GHC_VERSION-$AGDA_VERSION-${{ hashFiles('agda-index/AgdaIndex.hs', 'stdlib/*.cabal', 'stdlib/cabal.project*') }}" >> "$GITHUB_OUTPUT"
          echo "agdai=agdai-$AGDA_VERSION-${{ steps.commits.outputs.cubical }}-${{ steps.commits.outputs.stdlib }}" >> "$GITHUB_OUTPUT"

      # one dir for packages, store and script builds
      - name: Pin cabal dir
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"

      # before setup, so cabal update refreshes it
      - name: Restore cabal cache
        id: cabal
        uses: actions/cache/restore@v6
        with:
          lookup-only: ${{ steps.commits.outputs.skip == 'true' }}
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/script-builds
          key: ${{ steps.keys.outputs.cabal }}
          restore-keys: cabal-${{ env.GHC_VERSION }}-${{ env.AGDA_VERSION }}-

      - uses: haskell-actions/setup@v2
        if: steps.commits.outputs.skip != 'true'
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: true

      - name: Build indexer
        if: steps.commits.outputs.skip != 'true'
        run: |
          cabal build --ghc-options='+RTS -M6G -RTS' agda-index/AgdaIndex.hs
          echo "AGDA_INDEX=$(cabal list-bin agda-index/AgdaIndex.hs)" >> "$GITHUB_ENV"

      - name: Restore interface cache
        uses: actions/cache/restore@v6
        with:
          lookup-only: ${{ steps.commits.outputs.skip == 'true' }}
          path: |
            cubical/_build
            stdlib/_build
            stdlib/doc/_build
          key: ${{ steps.keys.outputs.agdai }}
          restore-keys: agdai-${{ env.AGDA_VERSION }}-

      - name: Index cubical
        if: steps.commits.outputs.skip != 'true'
        working-directory: cubical
        run: |
          ./generate-everything.sh > Cubical/Everything.agda
          "$AGDA_INDEX" +RTS -M14G -RTS --index \
            --index-lib=cubical \
            --index-commit=${{ steps.commits.outputs.cubical }} \
            --index-url=https://agda.github.io/cubical/ \
            --index-source=https://github.com/agda/cubical/blob/${{ steps.commits.outputs.cubical }}/ \
            --index-out=../cubical.json \
            Cubical/Everything.agda

      - name: Index stdlib
        if: steps.commits.outputs.skip != 'true'
        working-directory: stdlib
        run: |
          cabal run GenerateEverything -- --out-dir doc
          cd doc
          "$AGDA_INDEX" +RTS -M14G -RTS --index \
            --index-lib=stdlib \
            --index-commit=${{ steps.commits.outputs.stdlib }} \
            --index-url=https://agda.github.io/agda-stdlib/master/ \
            --index-source=https://github.com/agda/agda-stdlib/blob/${{ steps.commits.outputs.stdlib }}/src/ \
            --index-out=../../stdlib.json \
            Everything.agda

      # save once agda is built
      - name: Check agda build
        id: deps
        if: always() && steps.commits.outputs.skip != 'true'
        run: |
          if ls -d "$CABAL_DIR"/store/*/Agda-"$AGDA_VERSION"-* >/dev/null 2>&1; then
            echo "agda=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save cabal cache
        if: always() && steps.deps.outputs.agda == 'true' && steps.cabal.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/script-builds
          key: ${{ steps.keys.outputs.cabal }}

      - name: Save interface cache
        if: always() && steps.commits.outputs.skip != 'true' && steps.keys.outputs.agdai
        uses: actions/cache/save@v6
        with:
          path: |
            cubical/_build
            stdlib/_build
            stdlib/doc/_build
          key: ${{ steps.keys.outputs.agdai }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compress index
        if: steps.commits.outputs.skip != 'true'
        run: gzip -9 cubical.json stdlib.json

      - uses: actions/upload-artifact@v7
        if: steps.commits.outputs.skip != 'true'
        with:
          name: agda-index
          path: |
            cubical.json.gz
            stdlib.json.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: index
    if: needs.index.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agda-index

      - name: Publish
        env:
          STAMP: ${{ needs.index.outputs.stamp }}
          CUBICAL: ${{ needs.index.outputs.cubical }}
          STDLIB: ${{ needs.index.outputs.stdlib }}
        run: |
          count() { gunzip -c "$1" | jq '.meta.count'; }
          commit() { echo "[\`$(echo "$2" | cut -c1-7)\`](https://github.com/$1/commit/$2)"; }
          cat > notes.md <<EOF
          Search index of [agda/cubical](https://github.com/agda/cubical) and [agda/agda-stdlib](https://github.com/agda/agda-stdlib) for donbot's \`agda\` command.

          | library | commit | definitions |
          |---|---|---:|
          | cubical | $(commit agda/cubical "$CUBICAL") | $(count cubical.json.gz) |
          | stdlib | $(commit agda/agda-stdlib "$STDLIB") | $(count stdlib.json.gz) |

          Agda $AGDA_VERSION · GHC $GHC_VERSION · built $(date -u +%F) by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          <!-- stamp: $STAMP -->
          EOF
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "agda index" --notes "" --latest=false
          gh release upload "$TAG" cubical.json.gz stdlib.json.gz --clobber
          gh release edit "$TAG" --notes-file notes.md

      - name: Close failure issue
        run: |
          gh issue list --state open --search "in:title \"$ISSUE\"" --json number -q '.[].number' |
            xargs -r -n1 gh issue close --comment "Fixed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # notify on index build failure
  notify:
    needs: [index, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update failure issue
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --state open --search "in:title \"$ISSUE\"" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $run"
          else
            gh issue create --title "$ISSUE" --body "The agda index build failed: $run. donbot keeps serving the last published index until a build succeeds."
          fi

  # keepalive after 60 idle days
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow enable agda-index.yml
