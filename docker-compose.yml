services:
  donbot:
    image: ghcr.io/vikraman/donbot:latest
    container_name: donbot
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - redis
    labels:
      - com.centurylinklabs.watchtower.enable=true

  redis:
    image: redis:8-alpine
    container_name: donbot-redis
    restart: unless-stopped
    mem_limit: 576m
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-data:/data
    command: redis-server --save 3600 1 --appendonly yes --auto-aof-rewrite-min-size 8mb --search-max-prefix-expansions 1000000 --hash-max-listpack-value 8192 --maxmemory 384mb --maxmemory-policy noeviction --activedefrag yes

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup --label-enable

volumes:
  redis-data:
